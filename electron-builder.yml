# Single source of electron-builder configuration.
# (Until v2.0.0 a `build` field in package.json took precedence and this file
# was ignored, so the values below mirror what shipped in v1.x.)

# Do not change: the Windows installer identity (and therefore in-place
# upgrades of existing installs) is derived from appId.
appId: com.electron.salla-excel-merger
productName: salla-excel-merger
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!docs/*'
  - '!resources/python/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest.config.ts,postcss.config.js}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,requirements.txt}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# PyInstaller executables built by the release workflow (see src/main/ipc/python.ts)
extraResources:
  - from: resources/python
    to: python
    filter:
      - '**/*'
asarUnpack:
  - resources/**
win:
  executableName: salla-excel-merger
linux:
  target:
    - AppImage
  maintainer: SultanBajaifer
  category: Utility
npmRebuild: false
publish:
  provider: github
  owner: SultanBajaifer
  repo: salla-excel-merger
  releaseType: release
