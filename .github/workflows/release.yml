name: Release

# Builds the Windows installer and publishes it to GitHub Releases, which is
# where the in-app updater looks for new versions. Runs only for version tags:
#   git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Bundle Python scripts
        run: |
          pyinstaller --onefile --distpath ./resources/python ./scripts/clean_excel.py
          pyinstaller --onefile --distpath ./resources/python ./scripts/extract_brands.py

      - name: Install Node dependencies
        run: npm ci

      - name: Verify license public key is configured
        run: npm run license:check

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build and publish Windows installer
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
